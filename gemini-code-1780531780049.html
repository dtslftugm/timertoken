<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Reminder System</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #00adb5;
            --alert-color: #ff2e63;
            --green-color: #00e676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.2s;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Flashing Animation */
        @keyframes flash-red {
            0%, 100% { background-color: var(--bg-color); }
            50% { background-color: #b30000; }
        }
        .alarm-active {
            animation: flash-red 0.5s infinite;
        }

        .container { width: 100%; max-width: 1100px; }

        /* Header & Clock */
        header {
            text-align: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
        }
        #digital-clock { font-size: 3.5rem; font-weight: bold; color: var(--accent-color); font-variant-numeric: tabular-nums; }
        #current-info { font-size: 1.2rem; margin-top: 5px; color: var(--text-muted); }
        #sync-status { font-size: 0.85rem; color: var(--green-color); margin-top: 5px; }

        /* Alarm Overlay Button */
        #mute-btn {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            padding: 20px 50px;
            font-size: 2rem;
            font-weight: bold;
            background-color: var(--text-color);
            color: #b30000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Config Grid */
        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 600px) { .grid-config { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card h2 { border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; margin-bottom: 15px; font-size: 1.4rem; }
        
        .session-section { margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; }
        .session-section h3 { font-size: 1rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        /* Form Controls */
        .form-inline { display: flex; gap: 8px; margin-bottom: 10px; }
        .form-inline input[type="text"] { flex: 2; }
        .form-inline input[type="time"] { flex: 1; }
        input, button {
            padding: 8px 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: var(--accent-color); }
        button.btn-add { background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; border: none; }
        button.btn-add:hover { opacity: 0.9; }

        /* List View */
        .reminder-list { list-style: none; }
        .reminder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(0,0,0,0.2);
            margin-bottom: 5px;
            border-radius: 4px;
            border-left: 4px solid var(--accent-color);
        }
        .reminder-item.active-today { border-left-color: var(--green-color); }
        .reminder-item .actions button { background: var(--alert-color); border: none; font-size: 0.8rem; cursor: pointer; padding: 4px 8px; }
        .reminder-item .time-tag { font-weight: bold; font-variant-numeric: tabular-nums; background: #333; padding: 2px 6px; border-radius: 4px; }

        /* Live Monitor Queue */
        .monitor-card { width: 100%; background: #1a2f3b; border: 1px solid var(--accent-color); margin-bottom: 20px; }
        .monitor-card h2 { border-bottom-color: var(--green-color); }
        .countdown-text { color: var(--alert-color); font-weight: bold; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

<button id="mute-btn" onclick="stopAlarm()">MATIKAN ALARM</button>

<div class="container">
    <header>
        <div id="digital-clock">00:00:00</div>
        <div id="current-info">Memuat data waktu...</div>
        <div id="sync-status">Menghubungkan ke server waktu internet...</div>
    </header>

    <div class="card monitor-card">
        <h2>Antrean Pengingat Hari Ini (-3 Menit Target)</h2>
        <ul id="today-queue" class="reminder-list">
            </ul>
    </div>

    <div class="grid-config">
        <div class="card">
            <h2>Hari Reguler (Senin - Kamis, Sabtu - Minggu)</h2>
            
            <div class="session-section">
                <h3>Sesi Pagi</h3>
                <div class="form-inline">
                    <input type="text" id="reg-pagi-nama" placeholder="Nama Token/Reminder">
                    <input type="time" id="reg-pagi-waktu">
                    <button class="btn-add" onclick="addReminder('regular', 'pagi')">+</button>
                </div>
                <ul id="list-reg-pagi" class="reminder-list"></ul>
            </div>

            <div class="session-section">
                <h3>Sesi Siang</h3>
                <div class="form-inline">
                    <input type="text" id="reg-siang-nama" placeholder="Nama Token/Reminder">
                    <input type="time" id="reg-siang-waktu">
                    <button class="btn-add" onclick="addReminder('regular', 'siang')">+</button>
                </div>
                <ul id="list-reg-siang" class="reminder-list"></ul>
            </div>
        </div>

        <div class="card">
            <h2>Khusus Hari Jum'at</h2>
            
            <div class="session-section">
                <h3>Sesi Pagi</h3>
                <div class="form-inline">
                    <input type="text" id="fri-pagi-nama" placeholder="Nama Token/Reminder">
                    <input type="time" id="fri-pagi-waktu">
                    <button class="btn-add" onclick="addReminder('friday', 'pagi')">+</button>
                </div>
                <ul id="list-fri-pagi" class="reminder-list"></ul>
            </div>

            <div class="session-section">
                <h3>Sesi Siang</h3>
                <div class="form-inline">
                    <input type="text" id="fri-siang-nama" placeholder="Nama Token/Reminder">
                    <input type="time" id="fri-siang-waktu">
                    <button class="btn-add" onclick="addReminder('friday', 'siang')">+</button>
                </div>
                <ul id="list-fri-siang" class="reminder-list"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    // State Aplikasi
    let timeOffset = 0; // Selisih milidetik antara jam lokal device dan internet
    let database = {
        regular: { pagi: [], siang: [] },
        friday: { pagi: [], siang: [] }
    };
    let isAlarmActive = false;
    let audioInterval = null;
    const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

    // 1. Sinkronisasi Waktu dengan Internet (World Time API)
    async function syncTime() {
        const statusEl = document.getElementById('sync-status');
        try {
            const startLoad = Date.now();
            // Menggunakan API zona Jakarta (UTC+7)
            const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Jakarta');
            if(!response.ok) throw new Error("Gagal fetch API");
            
            const data = await response.json();
            const internetTime = new Date(data.datetime).getTime();
            
            // Kompensasi latency dasar jaringan
            const latency = (Date.now() - startLoad) / 2;
            
            // Hitung selisih waktu aktual
            timeOffset = (internetTime + latency) - Date.now();
            statusEl.textContent = "⏱️ Waktu sinkron dengan internet (UTC+7)";
            statusEl.style.color = "var(--green-color)";
        } catch (error) {
            console.error("Gagal sinkronisasi waktu:", error);
            statusEl.textContent = "⚠️ Gagal sinkronisasi internet. Menggunakan basis jam perangkat lokal.";
            statusEl.style.color = "var(--alert-color)";
        }
    }

    // Mendapatkan Objek Date yang sudah dikompensasi akurasinya
    function getAccurateDate() {
        return new Date(Date.now() + timeOffset);
    }

    // 2. Manajemen Data (Local Storage)
    function loadData() {
        const localData = localStorage.getItem('token_reminder_db');
        if (localData) {
            database = JSON.parse(localData);
        }
        renderAllLists();
    }

    function saveData() {
        localStorage.setItem('token_reminder_db', JSON.stringify(database));
        renderAllLists();
    }

    function addReminder(type, session) {
        const namaIn = document.getElementById(`${type === 'regular' ? 'reg' : 'fri'}-${session}-nama`);
        const waktuIn = document.getElementById(`${type === 'regular' ? 'reg' : 'fri'}-${session}-waktu`);

        if (!namaIn.value || !waktuIn.value) {
            alert("Mohon isi Nama Reminder dan Waktunya.");
            return;
        }

        const newItem = {
            id: Date.now().toString(),
            nama: namaIn.value,
            waktu: waktuIn.value
        };

        database[type][session].push(newItem);
        
        // Urutkan berdasarkan waktu terkecil ke terbesar
        database[type][session].sort((a,b) => a.waktu.localeCompare(b.waktu));

        namaIn.value = '';
        waktuIn.value = '';
        saveData();
    }

    function deleteReminder(type, session, id) {
        database[type][session] = database[type][session].filter(item => item.id !== id);
        saveData();
    }

    // 3. Render Interface Lists
    function renderAllLists() {
        const sections = [
            { type: 'regular', session: 'pagi', elId: 'list-reg-pagi' },
            { type: 'regular', session: 'siang', elId: 'list-reg-siang' },
            { type: 'friday', session: 'pagi', elId: 'list-fri-pagi' },
            { type: 'friday', session: 'siang', elId: 'list-fri-siang' }
        ];

        sections.forEach(sec => {
            const ul = document.getElementById(sec.elId);
            ul.innerHTML = '';
            database[sec.type][sec.session].forEach(item => {
                const li = document.createElement('li');
                li.className = 'reminder-item';
                li.innerHTML = `
                    <span>${item.nama}</span>
                    <div class="actions">
                        <span class="time-tag">${item.waktu}</span>
                        <button onclick="deleteReminder('${sec.type}', '${sec.session}', '${item.id}')">Hapus</button>
                    </div>
                `;
                ul.appendChild(li);
            });
        });
    }

    // 4. Audio Engine (Web Audio API)
    function playTone() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Frekuensi 880Hz (Bip tajam)
            
            gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            setTimeout(() => { oscillator.stop(); }, 300);
        } catch(e) {
            console.log("Audio Context diblokir browser sebelum ada
